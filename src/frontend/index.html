<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>Portal de Sistemas & Ordens de Serviço</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-layout">
        <!-- Barra Lateral (Menus Dinâmicos) -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>Portal Corporativo</h2>
                <span id="status-rede" class="badge badge-online">Online</span>
            </div>

            <div class="user-box">
                <label for="input-usuario">Usuário de Rede:</label>
                <div class="input-group">
                    <input type="text" id="input-usuario" value="Administrador" placeholder="Ex: Carlos">
                    <button id="btn-carregar" type="button">Carregar</button>
                </div>
            </div>

            <nav id="menu-container" class="menu-tree" aria-label="Menu de Sistemas">
                <p class="empty-msg">Informe o usuário e clique em Carregar.</p>
            </nav>
        </aside>

        <!-- Área Principal -->
        <main class="main-content">
            <header class="topbar">
                <button id="btn-toggle-menu" class="btn-icon" aria-label="Alternar Menu">☰</button>
                <h1 id="titulo-pagina">Bem-vindo ao Portal</h1>
            </header>

            <!-- Alerta de Ordens de Serviço Pendentes de Ciência -->
            <section id="os-pendentes-container" class="os-banner hidden"></section>

            <!-- Área de Trabalho / Visualização da Transação -->
            <section id="workspace" class="workspace">
                <div class="welcome-card">
                    <h3>Acesso Baseado em Ordens de Serviço</h3>
                    <p>Selecione um sistema e uma transação no menu lateral para iniciar.</p>
                </div>
            </section>
        </main>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
